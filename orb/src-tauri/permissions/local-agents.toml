[[permission]]
identifier = "allow-local-agents"
description = "Detect local agent CLIs, copy project files into the local workspace, and run those CLIs"
commands.allow = [
  "software_inventory",
  "software_update",
  "software_cancel",
  "local_origin_launch",
  "local_origin_list",
  "local_origin_disconnect",
  "project_context_file",
  "project_context_prepare",
  "project_context_status",
  "project_context_disconnect",
  "local_run_launch",
  "local_run_reconcile",
  "local_bindings",
  "local_interaction",
  "local_interaction_answer",
  "local_session_git",
  "local_agents_scan",
  "local_agents_workspace",
  "local_agents_write",
  "local_agents_start_authorized",
  "local_machine_identity",
  "local_machine_transfer",
  "local_agents_poll",
  "local_agents_subscribe",
  "browse_local_files",
  "pick_upload_files",
  "read_upload_file",
  "stage_upload_file",
  "local_agents_stop",
]
