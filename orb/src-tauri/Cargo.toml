[package]
name = "orb"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["macos-private-api"] }
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32.1"
libc = "0.2"
rfd = "0.17"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
